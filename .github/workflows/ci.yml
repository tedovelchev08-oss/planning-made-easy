name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Runs before the build: a failing test should stop the pipeline at the
      # cheapest point, and a green build says nothing about behaviour.
      - name: Test
        run: npm run test:run

      # Runners are UTC, which is the one timezone the date bugs do not show up
      # in. toDayKey shifts a day WEST of Greenwich, and the marketing sample
      # date shifted EAST — that one only failed at UTC+14 and passed
      # everywhere else. Both ends get checked, or neither bug would be caught.
      - name: Test across timezone extremes
        run: |
          for tz in Pacific/Midway Pacific/Kiritimati; do
            echo "::group::$tz"
            TZ=$tz npm run test:run
            echo "::endgroup::"
          done

      - name: Build
        run: npm run build

  rls-tests:
    name: Supabase RLS Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # pinned: `latest` let a CLI release change the local stack under us
          version: 2.118.0

      - name: Start Supabase
        run: supabase start

      - name: Run database tests
        run: |
          set -o pipefail
          supabase test db 2>&1 | tee pgtap.log

      # CI logs are not readable from where the fixes get written, so a failure
      # has to surface as annotations and a summary, or it gets fixed blind.
      - name: Surface pgTAP failures
        if: failure()
        run: |
          [ -f pgtap.log ] || exit 0   # failed before the tests ran
          grep -nE 'not ok|ERROR|Bad plan' pgtap.log | while IFS= read -r line; do
            echo "::error title=pgTAP::${line}"
          done || true
          {
            echo '## pgTAP failures'
            echo
            echo '```'
            tail -n 200 pgtap.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop Supabase
        if: always()
        run: supabase stop
