<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Luma — Plan the feeling, not just the wedding</title>
    <meta
      name="description"
      content="Luma turns the moving parts of your wedding into one calm, intelligent workspace: guests, budget, timeline, vendors, seating and invitations in a single place."
    />
    <meta name="theme-color" content="#fff8f0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Preload the two latin faces the first screen actually paints with. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/playfair-display-normal-latin.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/nunito-sans-normal-latin.woff2"
      crossorigin
    />

    <style>
      /* Paint the brand ground before the stylesheet arrives, so the first
         frame is cream rather than white. */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        background-color: #fff8f0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
