<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Twofold — Two of you. One plan.</title>
    <meta
      name="description"
      content="Twofold is the wedding planner you share: guests, budget, timeline, vendors, seating and invitations, planned together by the two of you and updated live."
    />
    <meta name="theme-color" content="#0f0e0d" />
    <!-- the two rings. "?v=2" makes browsers that saved Luma's heart fetch them again -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="48x48" />
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
    <link rel="icon" href="/brand/favicon-32.png?v=2" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- what a shared link shows -->
    <meta property="og:site_name" content="Twofold" />
    <meta property="og:title" content="Twofold — Two of you. One plan." />
    <meta property="og:description" content="The wedding planner you share: planned together, updated live." />
    <meta property="og:image" content="/brand/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Preload the two latin faces the first screen actually paints with. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/italiana-latin-400-normal.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/jost-latin-400-normal.woff2"
      crossorigin
    />

    <style>
      /* Paint the brand ground before the stylesheet arrives, so the first
         frame is ivory rather than white. */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        background-color: #f7f2e8;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
