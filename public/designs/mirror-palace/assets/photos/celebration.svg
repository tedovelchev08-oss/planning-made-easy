<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500" role="img">
  <defs>
    <radialGradient id="bloom" cx="50%" cy="24%" r="70%">
      <stop offset="0%"   stop-color="#e8d9b8" stop-opacity="0.55"/>
      <stop offset="38%"  stop-color="#c6b89c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1b1a1e"/>
      <stop offset="55%"  stop-color="#121114"/>
      <stop offset="100%" stop-color="#080809"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="50%" r="75%">
      <stop offset="55%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.72"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" result="n"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="1200" height="1500" fill="url(#fall)"/>

  <ellipse cx="600" cy="330" rx="720" ry="620" fill="url(#bloom)"/>
  <line x1="600" y1="0" x2="600" y2="250" stroke="#c6b89c" stroke-opacity="0.4" stroke-width="3"/>
  <g fill="#c6b89c" opacity="0.75">
    <circle cx="600" cy="286" r="26"/>
    <circle cx="470" cy="352" r="15"/><circle cx="730" cy="352" r="15"/>
    <circle cx="530" cy="410" r="11"/><circle cx="670" cy="410" r="11"/>
    <circle cx="600" cy="392" r="13"/>
  </g>
  <ellipse cx="600" cy="340" rx="290" ry="240" fill="#e8d9b8" opacity="0.14"/>
  <rect x="140" y="960" width="920" height="16" rx="8" fill="#c6b89c" opacity="0.22"/>
  <g fill="#f4e6c4" opacity="0.85">
    <ellipse cx="300" cy="930" rx="9" ry="18"/><ellipse cx="470" cy="922" rx="9" ry="18"/>
    <ellipse cx="640" cy="930" rx="9" ry="18"/><ellipse cx="820" cy="922" rx="9" ry="18"/>
  </g>
  <rect y="976" width="1200" height="524" fill="#0a0a0a"/>
  <rect width="1200" height="1500" fill="url(#vig)"/>
  <rect width="1200" height="1500" filter="url(#grain)" opacity="0.07" style="mix-blend-mode:overlay"/>
</svg>
