<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" role="img">
  <defs>
    <radialGradient id="bloom" cx="50%" cy="30%" r="70%">
      <stop offset="0%"   stop-color="#e8d9b8" stop-opacity="0.55"/>
      <stop offset="38%"  stop-color="#c6b89c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1b1a1e"/>
      <stop offset="55%"  stop-color="#121114"/>
      <stop offset="100%" stop-color="#080809"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="50%" r="75%">
      <stop offset="55%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.72"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" result="n"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="1600" height="1200" fill="url(#fall)"/>

  <ellipse cx="800" cy="420" rx="820" ry="700" fill="url(#bloom)"/>
  <g filter="url(#soft)">
    <path d="M660 1200 V700 a78 78 0 0 1 156 0 v500 z" fill="#050506"/>
    <circle cx="738" cy="642" r="64" fill="#050506"/>
    <path d="M810 1200 V664 a82 82 0 0 1 164 0 v536 z" fill="#050506"/>
    <circle cx="892" cy="606" r="66" fill="#050506"/>
  </g>
  <ellipse cx="815" cy="1200" rx="330" ry="22" fill="#c6b89c" opacity="0.1"/>
  <rect width="1600" height="1200" fill="url(#vig)"/>
  <rect width="1600" height="1200" filter="url(#grain)" opacity="0.07" style="mix-blend-mode:overlay"/>
</svg>
