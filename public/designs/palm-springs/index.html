<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>You&rsquo;re Invited</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#d9c3a3">

<!-- Fonts served by Luma (licences beside each file in ../_shared/fonts) -->
<link rel="stylesheet" href="../_shared/fonts/fonts.css">
<link rel="stylesheet" href="springs.css?v=2">
<style>
  html.luma-loading { background: #f3ece0; }
  html.luma-loading body { visibility: hidden; }
  .luma-notice { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; background: #f3ece0; color: #22344f; font-family: 'Josefin Sans', sans-serif; }
  .luma-notice h1 { font-family: 'Bodoni Moda', Georgia, serif; font-size: 34px; font-weight: 400; font-style: italic; margin: 0; }
  .luma-notice p { font-size: 16px; max-width: 30rem; margin: 0; opacity: .8; }
  .luma-notice a { margin-top: 8px; color: #8a6a36; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; }
  .luma-check:empty { display: none; }
</style>
</head>
<body>

<!-- ============================================================
     PALM SPRINGS
     A desert hotel at the golden hour, in the manner of a Slim Aarons
     photograph. You look down into the pool: their initials are set
     in its floor in a medallion of blue and gold-leaf glass mosaic,
     and their names are cut into the travertine at its edge. The rest
     is the hotel: the invitation, a letterhead on a wall the pool
     throws its light across, prints in frames, the itinerary, and a
     cabana reservation card that is stamped and sealed when sent.
     ============================================================ -->
<main id="main">

<section class="pool" id="hero" aria-label="The invitation">
  <svg class="water" id="water" aria-hidden="true" preserveAspectRatio="xMidYMid slice"></svg>
  <img class="frond sway" src="assets/frond.png" alt="" aria-hidden="true">
  <div class="engraved" id="engraved">
    <h1 id="poolNames"></h1>
    <p id="poolDate"></p>
  </div>
</section>

<section class="invite" id="invitation">
  <div class="still" role="img" aria-label="The pool at the hotel, in the evening light"></div>
  <div class="words rv">
    <p class="caps" id="inviteAbove"></p>
    <p class="script" id="inviteNames"></p>
    <p class="line" id="inviteLine"></p>
    <span class="rule" aria-hidden="true"></span>
    <p class="formal" id="inviteDate"></p>
    <p class="formal small" id="inviteTime"></p>
    <p class="caps where" id="invitePlace"></p>
  </div>
</section>

<!-- the day, on the hotel's letterhead, on a wall the pool lights -->
<section class="sec lit" id="the-day">
  <svg class="glow" aria-hidden="true"></svg>
  <img class="frond sway slow" src="assets/frond.png" alt="" aria-hidden="true" loading="lazy">
  <div class="letterhead rv">
    <span class="mono" data-mono aria-hidden="true"></span>
    <p class="house" id="dayVenue"></p>
    <span class="rule" aria-hidden="true"></span>
    <p class="formal" id="dayDate"></p>
    <p class="formal small" id="dayTime"></p>
    <p class="addr" id="dayAddr"></p>
    <p class="dress" id="dayDress"></p>
    <p class="links">
      <a id="venueLink" href="#" target="_blank" rel="noopener">Directions</a>
      <a id="gcal-link" href="#" target="_blank" rel="noopener">Google Calendar</a>
      <a id="ics-link" href="#">Apple Calendar</a>
    </p>
  </div>
</section>

<section class="sec lit" id="story">
  <svg class="glow" aria-hidden="true"></svg>
  <div class="wrap lean">
    <figure class="framed rv"><img class="couple" alt="The two of you" hidden></figure>
    <div class="story-words rv">
      <p class="caps">How it started</p>
      <h2 id="storyHeadline"></h2>
      <p class="body" id="storyP1"></p>
      <p class="body" id="storyP2"></p>
    </div>
  </div>
</section>

<section class="sec cream" id="schedule">
  <div class="still lounger rv" role="img" aria-label="An itinerary in a leather holder on a lounger"></div>
  <div class="itinerary rv">
    <span class="mono" data-mono aria-hidden="true"></span>
    <p class="caps" id="scheduleHeading"></p>
    <p class="formal" id="sheetDay"></p>
    <ol class="rows" id="tlItems"></ol>
  </div>
</section>

<section class="sec lit" id="gallery">
  <svg class="glow" aria-hidden="true"></svg>
  <h2 class="center" id="galleryHeading"></h2>
  <div class="prints"></div>
</section>

<section class="sec cream" id="faq">
  <div class="wrap narrow">
    <h2 class="center">Good to know</h2>
    <div class="asks" id="faq-drawer-list"></div>
  </div>
</section>

<!-- The reply: a cabana reservation card. When it is saved it is
     stamped, then folded into its envelope, which seals. -->
<section class="sec terrace" id="rsvp">
  <img class="frond sway slow" src="assets/frond.png" alt="" aria-hidden="true" loading="lazy">
  <div class="reply" id="reply">
    <form class="card" id="rsvp-form" name="rsvp" method="POST" novalidate>
      <input type="hidden" name="form-name" value="rsvp">
      <p class="hp" aria-hidden="true"><label>Leave this field empty<input name="bot-field" tabindex="-1" autocomplete="off"></label></p>
      <span class="mono" data-mono aria-hidden="true"></span>
      <p class="caps">Cabana reservation</p>
      <p class="formal small" id="replyBy"></p>
      <div class="line-field">
        <label for="rsvpName">Name</label>
        <input type="text" id="rsvpName" name="guest_names" placeholder="" autocomplete="name" required>
      </div>
      <div class="ticks" role="radiogroup" aria-label="Will you be there?">
        <label class="tick selected"><input type="radio" name="attending" value="yes" checked><span class="box" aria-hidden="true"></span><span>Accepts with pleasure</span></label>
        <label class="tick"><input type="radio" name="attending" value="no"><span class="box" aria-hidden="true"></span><span>Declines with regret</span></label>
      </div>
      <div id="comingFields">
        <div class="party">
          <span class="label" id="partyLabel">Number in party</span>
          <div class="numerals" role="radiogroup" aria-labelledby="partyLabel">
            <label><input type="radio" name="guest_count" value="1"><span>1</span></label>
            <label class="on"><input type="radio" name="guest_count" value="2" checked><span>2</span></label>
            <label><input type="radio" name="guest_count" value="3"><span>3</span></label>
            <label><input type="radio" name="guest_count" value="4"><span>4</span></label>
            <label><input type="radio" name="guest_count" value="5"><span>5</span></label>
            <label><input type="radio" name="guest_count" value="6"><span>6</span></label>
          </div>
        </div>
        <div class="line-field" id="rsvp-plusone-wrap">
          <label for="rsvp-plusone-name">With</label>
          <input type="text" id="rsvp-plusone-name" name="plusone_name" placeholder="">
        </div>
        <div class="line-field">
          <label for="rsvpDietary">Dietary notes</label>
          <input type="text" id="rsvpDietary" name="dietary" placeholder="">
        </div>
      </div>
      <div class="line-field">
        <label for="rsvpMessage">A note</label>
        <textarea id="rsvpMessage" name="notes" rows="1" placeholder=""></textarea>
      </div>
      <button type="submit" class="send" id="rsvpSubmit">Reserve</button>
      <p class="err" id="rsvp-error" role="alert" hidden></p>
      <span class="stamp" aria-hidden="true"><span class="stamp-in"><b>Reserved</b><i id="stampDate"></i></span></span>
    </form>

    <div class="envelope" aria-hidden="true">
      <span class="env-back"></span>
      <span class="env-card"><span class="mono" data-mono></span><span class="stamp mini"><span class="stamp-in"><b>Reserved</b></span></span></span>
      <span class="env-pocket"></span>
      <span class="env-flap"><span class="seal" data-mono></span></span>
    </div>

    <div class="done" id="rsvp-confirmed" hidden>
      <p class="formal">Your reply is sealed and on its way.</p>
      <p class="caps" id="sentTo"></p>
      <button type="button" class="again" id="rsvpAgain">Send a different reply</button>
    </div>
  </div>
</section>

<section class="closing" id="closing">
  <div class="still dusk" role="img" aria-label="The pool at dusk"></div>
  <div class="words rv">
    <p class="script" id="closingNames"></p>
    <p class="caps" id="closingLine"></p>
  </div>
</section>

<footer>
  <span id="footNames"></span>
  <span>Palm Springs</span>
</footer>
</main>

<script src="../_shared/luma-bridge.js?v=2"></script>
<script src="luma-springs.js?v=2"></script>
</body>
</html>
